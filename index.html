<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>避けろ！！ティーチママ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="game">

        <!-- ========================================
             ロード画面
        ========================================= -->

        <section id="loadingScreen" class="screen">

            <h1>
                避けろ！！ティーチママ
            </h1>

            <p id="loadingText">
                読み込み中……
            </p>

            <div id="loadingBar">
                <div id="loadingProgress"></div>
            </div>

            <p id="loadingPercent">
                0%
            </p>

        </section>


        <!-- ========================================
             タイトル画面
        ========================================= -->

        <section id="titleScreen" class="screen hidden">

            <h1>
                避けろ！！<br>
                ティーチママ
            </h1>

            <p>
                上から降ってくるみんなを<br>
                よけまくれ！！
            </p>

            <button id="startButton">
                ゲームスタート！
            </button>

        </section>


        <!-- ========================================
             ゲーム画面
        ========================================= -->

        <section id="gameScreen" class="screen hidden">

            <div id="score">
                避けた数：
                <span id="scoreValue">0</span>
            </div>

            <div id="gameField">
                <!-- キャラクターはJavaScriptで生成 -->
            </div>

        </section>


        <!-- ========================================
             だだ様イベント
        ========================================= -->

        <div id="dadaEvent" class="hidden">

            <img
                src="images/dada-event.png"
                alt="だだ様イベント"
            >

        </div>


        <!-- ========================================
             ゲームオーバー画面
        ========================================= -->

        <section id="gameOverScreen" class="screen hidden">

            <h2>
                当たったらゲームオーバー！
            </h2>

            <p>
                避けた数：
                <span id="finalScore">0</span>
            </p>

            <div id="nameInputArea">

                <label for="playerName">
                    ランキングに名前を登録！
                </label>

                <input
                    type="text"
                    id="playerName"
                    maxlength="20"
                    placeholder="ニックネーム"
                >

                <button id="rankingSubmitButton">
                    ランキングに登録
                </button>

            </div>

        </section>


        <!-- ========================================
             ランキング画面
        ========================================= -->

        <section id="rankingScreen" class="screen hidden">

            <h2>
                ランキング🏆
            </h2>

            <ol id="rankingList">
                <!-- JavaScriptで表示 -->
            </ol>

            <p id="rankingMessage"></p>

            <button id="retryButton">
                もう一回！
            </button>

        </section>


        <!-- ========================================
             スマホ用説明
        ========================================= -->

        <div id="mobileGuide" class="hidden">

            <p>
                画面を左右にスワイプしてティーチを動かそう！
            </p>

        </div>

    </main>


    <script type="module" src="script.js"></script>

</body>

</html>
